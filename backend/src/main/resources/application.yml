server:
  port: 8080

spring:
  application:
    name: docpulse-ai-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:docpulse}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      continue-on-error: true

  ai:
    openai:
      api-key: ${GROQ_API_KEY:gsk_placeholder}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.1-8b-instant}
          temperature: 0.2
      embedding:
        enabled: false
    embedding:
      huggingface:
        base-url: https://api-inference.huggingface.co/pipeline/feature-extraction/
        model: ${EMBEDDING_MODEL:BAAI/bge-small-en-v1.5}
        api-key: ${HUGGINGFACE_API_KEY:}
        dimensions: 384
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384
        initialize-schema: false
        table-name: vector_store

management:
  endpoints:
    web:
      exposure:
        include: health,info

